name: Daily Multibagger Screener

on:
  schedule:
    - cron: '0 3 * * 1-5' # 8:30 AM IST Monday-Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Tracker & Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCREENER_URL: ${{ secrets.SCREENER_URL }}
        run: python multibagger_screener.py

      - name: Commit & Push Tracking Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alerts_tracker.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update alert tracking database [skip ci]"
          git push
